name: Compilar APK, EXE y Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      cuda:
        description: 'Incluir también CUDA en Windows (≈700 MB más)'
        type: boolean
        default: false
      release_tag:
        description: 'Crear una release con esta etiqueta (p. ej. v1.0.0). Vacío = sólo compilar.'
        type: string
        default: ''

env:
  FLUTTER_VERSION: '3.50.0'
  # Generador de imágenes local (stable-diffusion.cpp). Windows usa su
  # compilación oficial con Vulkan; para Android se compila aquí con el NDK.
  SDCPP_COMMIT: fd21ecf
  SDCPP_RELEASE: master-995-fd21ecf

jobs:
  test:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: APK Android (arm64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/modelos
          key: modelos-android-${{ hashFiles('tool/incluir_modelos.py') }}
      - name: Incluir voces y Whisper
        run: python tool/incluir_modelos.py --perfil android --destino android/app/src/main/assets/incluidos
      - uses: actions/cache@v4
        id: sdcli-cache
        with:
          path: .cache/sdcli-android
          key: sdcli-android-${{ env.SDCPP_COMMIT }}-v1
      - name: Compilar el generador de imágenes para Android (sd-cli)
        if: steps.sdcli-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone https://github.com/leejet/stable-diffusion.cpp .cache/sdcpp-src
          cd .cache/sdcpp-src
          git checkout "$SDCPP_COMMIT"
          git submodule update --init ggml
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release \
            -DSD_WEBP=OFF -DSD_WEBM=OFF -DSD_BUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16
          cmake --build build-android --target sd-cli -j "$(nproc)"
          mkdir -p ../sdcli-android
          BIN=$(find build-android -type f -name sd-cli | head -1)
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -o ../sdcli-android/libsdcli.so "$BIN"
          ls -la ../sdcli-android
      - name: Incluir el generador de imágenes en el APK
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp .cache/sdcli-android/libsdcli.so android/app/src/main/jniLibs/arm64-v8a/libsdcli.so
      - name: Compilar APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Renombrar
        run: |
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk dist/DirectorDeRol-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DirectorDeRol-android
          path: dist/*.apk

  windows:
    name: EXE Windows (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Añadir CUDA (opcional)
        if: ${{ github.event.inputs.cuda == 'true' }}
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml) -replace 'backends: \[cpu, vulkan\] # windows', 'backends: [cpu, vulkan, cuda]' | Set-Content pubspec.yaml
      - run: flutter pub get
      - name: Compilar EXE
        run: flutter build windows --release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/modelos
          key: modelos-windows-${{ hashFiles('tool/incluir_modelos.py') }}
      - name: Incluir voces y Whisper
        run: python tool/incluir_modelos.py --perfil windows --destino build/windows/x64/runner/Release/incluidos
      - name: Incluir el generador de imágenes (sd-cli con Vulkan)
        shell: pwsh
        run: |
          $dest = "build/windows/x64/runner/Release/incluidos/sd"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $url = "https://github.com/leejet/stable-diffusion.cpp/releases/download/$env:SDCPP_RELEASE/sd-$($env:SDCPP_RELEASE.Split('-',3)[0])-$($env:SDCPP_COMMIT)-bin-win-vulkan-x64.zip"
          Write-Host $url
          Invoke-WebRequest -Uri $url -OutFile sd.zip -MaximumRetryCount 5 -RetryIntervalSec 10
          Expand-Archive sd.zip -DestinationPath $dest -Force
          Remove-Item "$dest/sd-server.exe", "$dest/start-server.*" -ErrorAction SilentlyContinue
          Get-ChildItem $dest
      - name: Empaquetar portable (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/DirectorDeRol-windows-x64-portable.zip
      - name: Crear instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)\+').Matches[0].Groups[1].Value
          # Con CUDA el instalador pasa de los 2 GB que admite un único .exe:
          # se reparte en setup.exe + ficheros .bin (van juntos).
          $extra = @()
          if ('${{ github.event.inputs.cuda }}' -eq 'true') { $extra += '/DRepartir' }
          & $iscc "/DAppVersion=$version" @extra installer/windows/director.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer/windows/Output/* dist/
      - uses: actions/upload-artifact@v4
        with:
          name: DirectorDeRol-windows
          path: |
            dist/*.exe
            dist/*.bin
            dist/*.zip

  linux:
    name: Linux (x64, escritorio X11/Wayland)
    needs: test
    runs-on: ubuntu-22.04 # glibc 2.35: vale para Ubuntu 22.04 LTS y posteriores
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias (GTK, GStreamer para el audio, PulseAudio para grabar)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar
        run: flutter build linux --release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/modelos
          key: modelos-linux-${{ hashFiles('tool/incluir_modelos.py') }}
      - name: Incluir voces y Whisper
        run: python tool/incluir_modelos.py --perfil linux --destino build/linux/x64/release/bundle/incluidos
      - name: Empaquetar
        run: |
          mkdir -p dist
          ls build/linux/x64/release/bundle
          tar -C build/linux/x64/release -czf dist/DirectorDeRol-linux-x64.tar.gz --transform 's,^bundle,director-de-rol,' bundle
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: DirectorDeRol-linux
          path: dist/*.tar.gz
      - name: Publicar en el release linux-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view linux-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create linux-latest -R "$GITHUB_REPOSITORY" --title "Director de Rol para Linux" \
              --notes "Compilación de Linux (x64) de la rama principal. La usa el instalador de la suite." --prerelease
          gh release upload linux-latest dist/DirectorDeRol-linux-x64.tar.gz -R "$GITHUB_REPOSITORY" --clobber

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Director de Rol ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
