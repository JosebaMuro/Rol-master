name: Compilar APK y EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      cuda:
        description: 'Incluir también CUDA en Windows (≈700 MB más)'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  test:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: APK Android (arm64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Renombrar
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/DirectorDeRol-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DirectorDeRol-android
          path: dist/*.apk

  windows:
    name: EXE Windows (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Añadir CUDA (opcional)
        if: ${{ github.event.inputs.cuda == 'true' }}
        shell: pwsh
        run: (Get-Content pubspec.yaml) -replace 'backends: \[cpu, vulkan\] # windows', 'backends: [cpu, vulkan, cuda]' | Set-Content pubspec.yaml
      - run: flutter pub get
      - name: Compilar EXE
        run: flutter build windows --release
      - name: Empaquetar portable (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/DirectorDeRol-windows-x64-portable.zip
      - name: Crear instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)\+').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer/windows/director.iss
          Copy-Item installer/windows/Output/*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: DirectorDeRol-windows
          path: |
            dist/*.exe
            dist/*.zip

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
